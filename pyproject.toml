[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-fish-tts"
version = "0.1.0"
description = "Zero-dependency OpenRouter Fish Audio S2.1 Pro TTS client"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["fish_tts"]

[project.scripts]
openrouter-fish-tts = "fish_tts:main"
